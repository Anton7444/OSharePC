name: Apply official BLE state flow

on:
  push:
    branches: [main]
    paths:
      - .github/official-ble-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: ./.github/scripts/apply-official-ble-state.ps1
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Anton7444"
          git config user.email "84059108+Anton7444@users.noreply.github.com"
          git add GattLink.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Follow OnePlus 9898 WLAN transition before state3"
            git push origin HEAD:main
          }
