name: Dispatch clean v1.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dispatch-v1.yml'

permissions:
  actions: write
  contents: write

env:
  TARGET_SHA: 5875bd3320a948086259c3dad0a207819a6ac5fc

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retag and dispatch Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v1.0 --yes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to delete existing v1.0 release' }
          }

          git ls-remote --exit-code --tags origin refs/tags/v1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            git push origin :refs/tags/v1.0
            if ($LASTEXITCODE -ne 0) { throw 'Failed to delete existing v1.0 tag' }
          }

          git tag v1.0 $env:TARGET_SHA
          git push origin refs/tags/v1.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push v1.0 tag' }

          gh workflow run release.yml --ref v1.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch Release workflow' }
