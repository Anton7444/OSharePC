name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
      - name: Determine release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore Flutter dependencies
        working-directory: catshare_gui
        run: flutter pub get
      - name: Analyze Flutter project
        working-directory: catshare_gui
        run: flutter analyze
      - name: Publish backend
        shell: pwsh
        run: dotnet publish CatShareSender.csproj -c Release -r win-x64 --self-contained true -o artifacts/backend
      - name: Run backend selftest
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CatShareSender\sender.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath 'artifacts/backend/CatShareSender.exe' -ArgumentList '--selftest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SELFTEST process exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $log) -or -not (Select-String -LiteralPath $log -Pattern 'SELFTEST PASSED' -Quiet)) { throw 'SELFTEST PASSED not found in sender.log' }
      - name: Build Flutter Windows release
        working-directory: catshare_gui
        run: flutter build windows --release
      - name: Assemble portable runtime
        shell: pwsh
        run: |
          ./scripts/assemble-portable.ps1 `
            -GuiRelease 'catshare_gui/build/windows/x64/runner/Release' `
            -BackendPublish 'artifacts/backend' `
            -OutputDirectory 'deploy-gui'
      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path 'deploy-gui/*' -DestinationPath "OSharePC-Portable-${{ env.RELEASE_VERSION }}-win-x64.zip"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:RELEASE_VERSION" 'installer/OSharePC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "installer-output/OSharePC-Setup-$env:RELEASE_VERSION.exe")) { throw 'Installer output was not created' }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          files: |
            OSharePC-Portable-${{ env.RELEASE_VERSION }}-win-x64.zip
            installer-output/OSharePC-Setup-${{ env.RELEASE_VERSION }}.exe
          generate_release_notes: true
