name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
      target_sha:
        description: Commit SHA the release tag should target
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Determine release version and target
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
            $target = '${{ inputs.target_sha }}'.Trim()
            if ([string]::IsNullOrWhiteSpace($target)) { $target = $env:GITHUB_SHA }
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $target = $env:GITHUB_SHA
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Release version is empty' }
          if ([string]::IsNullOrWhiteSpace($target)) { throw 'Release target is empty' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout exact release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.target }}
      - name: Verify checked-out target
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = '${{ steps.release.outputs.target }}'.Trim()
          if ($actual -ne $expected) { throw "Checked out $actual but release target is $expected" }
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
      - name: Restore Flutter dependencies
        working-directory: catshare_gui
        run: flutter pub get
      - name: Analyze Flutter project
        working-directory: catshare_gui
        run: flutter analyze
      - name: Publish backend
        shell: pwsh
        run: dotnet publish CatShareSender.csproj -c Release -r win-x64 --self-contained true -o artifacts/backend
      - name: Run backend selftest
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CatShareSender\sender.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath 'artifacts/backend/CatShareSender.exe' -ArgumentList '--selftest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SELFTEST process exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $log) -or -not (Select-String -LiteralPath $log -Pattern 'SELFTEST PASSED' -Quiet)) { throw 'SELFTEST PASSED not found in sender.log' }
      - name: Build Flutter Windows release
        working-directory: catshare_gui
        run: flutter build windows --release
      - name: Assemble portable runtime
        shell: pwsh
        run: |
          ./scripts/assemble-portable.ps1 `
            -GuiRelease 'catshare_gui/build/windows/x64/runner/Release' `
            -BackendPublish 'artifacts/backend' `
            -OutputDirectory 'deploy-gui'
      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path 'deploy-gui/*' -DestinationPath "OSharePC-Portable-${{ env.RELEASE_VERSION }}-win-x64.zip"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:RELEASE_VERSION" 'installer/OSharePC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "installer-output/OSharePC-Setup-$env:RELEASE_VERSION.exe")) { throw 'Installer output was not created' }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ steps.release.outputs.target }}
          name: ${{ env.RELEASE_VERSION }}
          files: |
            OSharePC-Portable-${{ env.RELEASE_VERSION }}-win-x64.zip
            installer-output/OSharePC-Setup-${{ env.RELEASE_VERSION }}.exe
          generate_release_notes: true
