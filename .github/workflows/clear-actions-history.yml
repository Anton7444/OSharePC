name: Clear Actions history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-actions-history.yml'

permissions:
  actions: write
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow run history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"
          current="$GITHUB_RUN_ID"

          echo "Current cleanup run: $current"

          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.status] | @tsv' > /tmp/runs.tsv

          while IFS=$'\t' read -r id status; do
            [ -z "${id:-}" ] && continue
            [ "$id" = "$current" ] && continue
            case "$status" in
              queued|in_progress|waiting|requested|pending)
                gh api --method POST "repos/$repo/actions/runs/$id/cancel" >/dev/null 2>&1 || true
                ;;
            esac
          done < /tmp/runs.tsv

          sleep 8

          for attempt in 1 2 3 4 5 6; do
            gh api --paginate "repos/$repo/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id' > /tmp/run_ids.txt

            remaining=0
            while read -r id; do
              [ -z "${id:-}" ] && continue
              [ "$id" = "$current" ] && continue
              if ! gh api --method DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1; then
                remaining=$((remaining + 1))
                gh api --method POST "repos/$repo/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              fi
            done < /tmp/run_ids.txt

            [ "$remaining" -eq 0 ] && break
            sleep 5
          done

          # Detached helper: cancel this final cleanup run, then delete it.
          # Clearing RUNNER_TRACKING_ID prevents the runner from immediately reaping the helper.
          env -u RUNNER_TRACKING_ID \
            GH_TOKEN="$GH_TOKEN" REPO="$repo" RUN_ID="$current" \
            setsid bash -c '
              sleep 4
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel" >/dev/null 2>&1 || true
              sleep 3
              for i in 1 2 3 4 5; do
                if curl -fsS -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
            ' >/dev/null 2>&1 < /dev/null &

          echo "Final self-delete helper started."
