name: Apply OConnect arm fix

on:
  push:
    branches: [main]
    paths:
      - .github/oconnect-arm-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: ./.github/scripts/fix-oconnect-arm.ps1
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Anton7444"
          git config user.email "84059108+Anton7444@users.noreply.github.com"
          git add SenderEngine.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Arm OConnect transfer before WLAN handoff"
            git push origin HEAD:main
          }
