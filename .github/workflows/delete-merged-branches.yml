name: Delete merged review branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            review/bridge-auth-legacy-ui \
            temp/delete-review-branch \
            temp/delete-review-branch-trigger; do
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/$GH_REPO/git/ref/heads/$encoded_branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$encoded_branch"
              echo "Deleted $branch"
            else
              echo "$branch already absent"
            fi
          done
