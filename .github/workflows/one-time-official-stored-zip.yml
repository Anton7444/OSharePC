name: Align sender ZIP with OnePlus Share

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply stored ZIP patch
        shell: pwsh
        run: python scripts/patch-official-stored-zip.py

      - name: Build backend
        shell: pwsh
        run: dotnet build CatShareSender.csproj -c Release

      - name: Run mock phone protocol test
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CatShareSender\sender.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = Resolve-Path 'bin/Release/net10.0-windows10.0.19041.0/win-x64/CatShareSender.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--mockphone' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "MOCKPHONE failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $log)) { throw 'sender.log missing' }
          Get-Content -LiteralPath $log | Select-String 'STORED|MOCKPHONE'
          if (-not (Select-String -LiteralPath $log -Pattern 'MOCKPHONE PASSED' -Quiet)) {
            Get-Content -LiteralPath $log
            throw 'MOCKPHONE PASSED not found'
          }

      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TransferServer.cs Program.cs OfficialStoredZipWriter.cs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Match OnePlus stored ZIP transfer path"
          git push origin HEAD:main
