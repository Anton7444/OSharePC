name: Apply remaining 1.0 version labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v1-release.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update installer and Settings versions
        shell: pwsh
        run: |
          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = [System.IO.File]::ReadAllText($Path)
            if (-not $text.Contains($Old)) {
              throw "Expected text not found in ${Path}: $Old"
            }
            [System.IO.File]::WriteAllText(
              $Path,
              $text.Replace($Old, $New),
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Replace-Exact 'installer/OSharePC.iss' '#define MyAppVersion "1.0.0"' '#define MyAppVersion "1.0"'
          Replace-Exact 'catshare_gui/lib/pages/settings_tab.dart' "static const _guiVersion = '2026.09.06-2300';" "static const _guiVersion = '1.0';"

      - name: Commit version labels to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/OSharePC.iss catshare_gui/lib/pages/settings_tab.dart
          git commit -m "Set installer and Settings version to 1.0"
          git push origin HEAD:main
