name: Apply remote cancel detection

on:
  push:
    paths:
      - '.github/workflows/one-time-remote-cancel-detection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch remote cancellation handling
        shell: pwsh
        run: |
          $py = @'
          from pathlib import Path

          p = Path('TransferServer.cs')
          s = p.read_text(encoding='utf-8')

          old = '''    private volatile TransferTask? _activeTask;\n    private CancellationTokenSource _cancelCts = new();'''
          new = '''    private volatile TransferTask? _activeTask;\n    private CancellationTokenSource _cancelCts = new();\n    private string? _successfulTaskId;\n    private string? _reportedFailureTaskId;\n    private string? _locallyCancelledTaskId;'''
          if old not in s: raise SystemExit('TransferServer field anchor missing')
          s = s.replace(old, new, 1)

          old = '''    public event Action<string>? DownloadFinished;          // taskId\n    public event Action<string, int, string>? StatusReceived; // (taskId, type, reason)'''
          new = '''    public event Action<string>? DownloadFinished;          // taskId; HTTP body finished, not receiver success\n    public event Action<string, int, string>? StatusReceived; // (taskId, type, reason)\n    public event Action<string, string>? TransferFailed;      // (taskId, reason)'''
          if old not in s: raise SystemExit('TransferServer events anchor missing')
          s = s.replace(old, new, 1)

          old = '''            _expectedPeerIp = Parse(expectedPeerIp);\n            _authorizedPeerIp = null;'''
          new = '''            _expectedPeerIp = Parse(expectedPeerIp);\n            _authorizedPeerIp = null;\n            _successfulTaskId = null;\n            _reportedFailureTaskId = null;\n            _locallyCancelledTaskId = null;'''
          if old not in s: raise SystemExit('ArmTransfer anchor missing')
          s = s.replace(old, new, 1)

          old = '''    public void CancelActiveTransfer()\n    {\n        _cancelCts.Cancel();'''
          new = '''    public void CancelActiveTransfer()\n    {\n        lock (_peerGate)\n            _locallyCancelledTaskId = _activeTask?.TaskId;\n        _cancelCts.Cancel();'''
          if old not in s: raise SystemExit('CancelActiveTransfer anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''    private static IPAddress? NormalizeIp(IPAddress? ip) =>\n        ip?.IsIPv4MappedToIPv6 == true ? ip.MapToIPv4() : ip;\n'''
          insert = anchor + '''\n    private bool IsSuccessful(string taskId)\n    {\n        lock (_peerGate) return _successfulTaskId == taskId;\n    }\n\n    private bool IsLocalCancellation(string taskId)\n    {\n        lock (_peerGate) return _locallyCancelledTaskId == taskId;\n    }\n\n    private void MarkSuccessful(string taskId)\n    {\n        if (string.IsNullOrWhiteSpace(taskId)) taskId = _activeTask?.TaskId ?? "";\n        if (string.IsNullOrWhiteSpace(taskId)) return;\n        lock (_peerGate)\n        {\n            _successfulTaskId = taskId;\n            _reportedFailureTaskId = null;\n        }\n    }\n\n    private void ReportTransferFailure(string taskId, string reason)\n    {\n        if (string.IsNullOrWhiteSpace(taskId)) taskId = _activeTask?.TaskId ?? "";\n        if (string.IsNullOrWhiteSpace(taskId)) return;\n        lock (_peerGate)\n        {\n            if (_successfulTaskId == taskId || _locallyCancelledTaskId == taskId || _reportedFailureTaskId == taskId)\n                return;\n            _reportedFailureTaskId = taskId;\n        }\n        Log.Warn($"TransferServer: remote transfer failed task={taskId}: {reason}");\n        try { TransferFailed?.Invoke(taskId, reason); } catch { }\n    }\n'''
          if anchor not in s: raise SystemExit('NormalizeIp anchor missing')
          s = s.replace(anchor, insert, 1)

          old = '''            var done = await session.ReceiveLoopAsync(TimeSpan.FromMinutes(30));\n            Log.Info($"WS: session ended ({done})");\n        }\n        catch (Exception ex)\n        {\n            Log.Error("WS: session error", ex);\n        }'''
          new = '''            var done = await session.ReceiveLoopAsync(TimeSpan.FromMinutes(30));\n            Log.Info($"WS: session ended ({done})");\n            if (committed && done != "transfer completed" && !IsSuccessful(task.TaskId))\n                ReportTransferFailure(task.TaskId, "Phone cancelled or disconnected before confirming receipt.");\n        }\n        catch (Exception ex)\n        {\n            if (committed && !IsSuccessful(task.TaskId))\n            {\n                ReportTransferFailure(task.TaskId,\n                    ex is System.Net.WebSockets.WebSocketException\n                        ? "Phone cancelled the transfer or disconnected."\n                        : $"Transfer connection failed: {ex.Message}");\n                Log.Warn($"WS: committed session ended before success confirmation: {ex.Message}");\n            }\n            else\n            {\n                Log.Error("WS: session error", ex);\n            }\n        }'''
          if old not in s: raise SystemExit('WS completion anchor missing')
          s = s.replace(old, new, 1)

          old = '''                    if (type == 1 && reason == "ok") return "transfer completed";\n                    if (type == 3) return $"refused: {reason}";'''
          new = '''                    // Stock OnePlus commonly sends success as type=1 with an empty reason.\n                    if (type == 1) return "transfer completed";\n                    if (type == 3) return $"refused: {reason}";'''
          if old not in s: raise SystemExit('status completion anchor missing')
          s = s.replace(old, new, 1)

          old = '''    private void OnStatus(string taskId, int type, string reason)\n    {\n        try { StatusReceived?.Invoke(taskId, type, reason); } catch { }\n        if (type is 1 or 3)\n            DisarmTransfer($"terminal status {type}: {reason}");\n    }'''
          new = '''    private void OnStatus(string taskId, int type, string reason)\n    {\n        if (string.IsNullOrWhiteSpace(taskId)) taskId = _activeTask?.TaskId ?? taskId;\n        if (type == 1)\n            MarkSuccessful(taskId);\n        else if (type == 3)\n            ReportTransferFailure(taskId, string.IsNullOrWhiteSpace(reason) ? "Phone refused the transfer." : reason);\n\n        try { StatusReceived?.Invoke(taskId, type, reason); } catch { }\n        if (type is 1 or 3)\n            DisarmTransfer($"terminal status {type}: {reason}");\n    }'''
          if old not in s: raise SystemExit('OnStatus anchor missing')
          s = s.replace(old, new, 1)

          # Make download cancellation report remote failure and avoid false DownloadFinished.
          old = '''            await WriteDownloadZip(\n                ctx,\n                single,\n                new FileInfo(single[0]).Length,\n                Path.GetFileName(single[0]),\n                _cancelCts.Token);\n            Log.Info($"HTTP: per-file zip done: {single[0]}");\n            try { DownloadFinished?.Invoke(task.TaskId); } catch { }\n            return;'''
          new = '''            try\n            {\n                await WriteDownloadZip(\n                    ctx,\n                    single,\n                    new FileInfo(single[0]).Length,\n                    Path.GetFileName(single[0]),\n                    _cancelCts.Token);\n            }\n            catch (OperationCanceledException)\n            {\n                if (ctx.RequestAborted.IsCancellationRequested && !IsLocalCancellation(task.TaskId))\n                    ReportTransferFailure(task.TaskId, "Phone cancelled the download.");\n                return;\n            }\n            catch (IOException ex) when (ctx.RequestAborted.IsCancellationRequested)\n            {\n                ReportTransferFailure(task.TaskId, $"Phone disconnected during download: {ex.Message}");\n                return;\n            }\n            Log.Info($"HTTP: per-file zip done: {single[0]}");\n            try { DownloadFinished?.Invoke(task.TaskId); } catch { }\n            return;'''
          if old not in s: raise SystemExit('per-file download anchor missing')
          s = s.replace(old, new, 1)

          old = '''        await WriteDownloadZip(ctx, task.Files, task.TotalSize, task.FirstFileName, _cancelCts.Token);\n        try { DownloadFinished?.Invoke(task.TaskId); } catch { }'''
          new = '''        try\n        {\n            await WriteDownloadZip(ctx, task.Files, task.TotalSize, task.FirstFileName, _cancelCts.Token);\n        }\n        catch (OperationCanceledException)\n        {\n            if (ctx.RequestAborted.IsCancellationRequested && !IsLocalCancellation(task.TaskId))\n                ReportTransferFailure(task.TaskId, "Phone cancelled the download.");\n            return;\n        }\n        catch (IOException ex) when (ctx.RequestAborted.IsCancellationRequested)\n        {\n            ReportTransferFailure(task.TaskId, $"Phone disconnected during download: {ex.Message}");\n            return;\n        }\n        try { DownloadFinished?.Invoke(task.TaskId); } catch { }'''
          if old not in s: raise SystemExit('batch download anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('SenderEngine.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        Server.DownloadFinished += taskId =>\n        {\n            TransferStateChanged?.Invoke(taskId, "download complete");\n            if (_staged?.TaskId == taskId) _staged.Complete = true;\n        };\n        Server.StatusReceived += (taskId, type, reason) =>\n            TransferStateChanged?.Invoke(taskId, $"status {type}: {reason}");'''
          new = '''        // HTTP body completion only means Windows finished writing bytes.\n        // Receiver success is authoritative only after the phone sends status type=1.\n        Server.DownloadFinished += taskId =>\n            TransferStateChanged?.Invoke(taskId, "upload stream complete — waiting for phone confirmation");\n        Server.StatusReceived += (taskId, type, reason) =>\n        {\n            if (type == 1 && _staged?.TaskId == taskId) _staged.Complete = true;\n            TransferStateChanged?.Invoke(taskId, $"status {type}: {reason}");\n        };\n        Server.TransferFailed += (taskId, reason) =>\n            TransferStateChanged?.Invoke(taskId, $"send failed: {reason}");'''
          if old not in s: raise SystemExit('SenderEngine status wiring anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('CatShareBridgeServer.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        _engine.Server.DownloadProgress += (sent, total) => Push("sendProgress", new { sent, total });\n        _engine.Server.DownloadFinished += taskId => Push("sendCompleted", new { taskId });'''
          new = '''        _engine.Server.DownloadProgress += (sent, total) => Push("sendProgress", new { sent, total });\n        // Do NOT mark success when the HTTP body merely finished writing. The phone\n        // can still cancel/reject before acknowledging receipt.\n        _engine.Server.StatusReceived += (taskId, type, reason) =>\n        {\n            if (type == 1)\n                Push("sendCompleted", new { taskId });\n            else if (type == 3)\n                Push("sendFailed", new { taskId, error = string.IsNullOrWhiteSpace(reason) ? "Phone refused the transfer." : reason });\n        };\n        _engine.Server.TransferFailed += (taskId, error) =>\n            Push("sendFailed", new { taskId, error });'''
          if old not in s: raise SystemExit('Bridge send completion anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          '@
          Set-Content -LiteralPath patch_remote_cancel.py -Value $py -Encoding utf8
          python patch_remote_cancel.py
          Remove-Item patch_remote_cancel.py

      - name: Build backend
        shell: pwsh
        run: dotnet build CatShareSender.csproj -c Release

      - name: Run mock phone
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CatShareSender/sender.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Path 'bin/Release' -Filter 'CatShareSender.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'CatShareSender.exe not found after build' }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--mockphone' -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log }; throw "mockphone exited $($p.ExitCode)" }
          if (-not (Test-Path $log) -or -not (Select-String -LiteralPath $log -Pattern 'MOCKPHONE PASSED' -Quiet)) { if (Test-Path $log) { Get-Content $log }; throw 'MOCKPHONE PASSED missing' }

      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TransferServer.cs SenderEngine.cs CatShareBridgeServer.cs
          git diff --cached --check
          git commit -m 'Detect phone-side transfer cancellation'
          git push origin HEAD:main
