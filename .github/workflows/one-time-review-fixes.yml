name: Apply requested code review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
      - name: Apply fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor: {label} in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Consistent mounted guard after async preference load.
          p = Path('catshare_gui/lib/pages/settings_tab.dart')
          text = p.read_text(encoding='utf-8')
          pattern = r"(Future<void> _loadTrayPrefs\(\) async \{\s*try \{\s*final prefs = await SharedPreferences\.getInstance\(\);\s*)(setState\(\(\) \{)"
          text, n = re.subn(pattern, r"\1if (!mounted) return;\n      \2", text, count=1)
          if n != 1:
              raise SystemExit('could not add tray mounted guard')
          p.write_text(text, encoding='utf-8')

          # 2) Delete plaintext temp WLAN XML left by a hard-killed process.
          p = Path('WifiJoiner.cs')
          text = p.read_text(encoding='utf-8')
          anchor = '    public static async Task CleanupStaleProfiles()\n    {\n        try\n        {\n            var shown = await Netsh("wlan show profiles");\n'
          replacement = '''    public static async Task CleanupStaleProfiles()
          {
              var staleXml = Path.Combine(Path.GetTempPath(), ProfileName + ".xml");
              try
              {
                  if (File.Exists(staleXml))
                  {
                      File.Delete(staleXml);
                      Log.Info($"RX: removed stale WLAN profile XML '{staleXml}'");
                  }
              }
              catch (Exception ex)
              {
                  Log.Warn($"RX: stale WLAN profile XML cleanup failed: {ex.Message}");
              }

              try
              {
                  var shown = await Netsh("wlan show profiles");
          '''
          if anchor not in text:
              raise SystemExit('missing WifiJoiner cleanup anchor')
          p.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          # 3) Localize transfer failures instead of showing raw backend English.
          p = Path('catshare_gui/lib/config/language.dart')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "      'stagingFailed': 'Could not stage the selected files.',\n": """      'stagingFailed': 'Could not stage the selected files.',
              'transferFailed': 'Transfer failed',
              'sendFailed': 'Could not send the file.',
              'receiveFailed': 'Could not receive the file.',
              'remoteCancelled': 'The phone cancelled the transfer.',
              'remoteRejected': 'The phone rejected the transfer.',
              'connectionLost': 'The connection to the phone was lost.',
              'transferTimedOut': 'The transfer timed out.',
          """,
              "      'stagingFailed': '无法暂存所选文件。',\n": """      'stagingFailed': '无法暂存所选文件。',
              'transferFailed': '传输失败',
              'sendFailed': '无法发送文件。',
              'receiveFailed': '无法接收文件。',
              'remoteCancelled': '手机已取消传输。',
              'remoteRejected': '手机已拒绝传输。',
              'connectionLost': '与手机的连接已断开。',
              'transferTimedOut': '传输超时。',
          """,
              "      'stagingFailed': '無法暫存選取的檔案。',\n": """      'stagingFailed': '無法暫存選取的檔案。',
              'transferFailed': '傳送失敗',
              'sendFailed': '無法傳送檔案。',
              'receiveFailed': '無法接收檔案。',
              'remoteCancelled': '手機已取消傳送。',
              'remoteRejected': '手機已拒絕傳送。',
              'connectionLost': '與手機的連線已中斷。',
              'transferTimedOut': '傳送逾時。',
          """,
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing language anchor: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('catshare_gui/lib/services/bridge_client.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import '../models/models.dart';\n", "import '../config/language.dart';\nimport '../models/models.dart';\n", 1)
          text = text.replace(
              '  QuickSaveMode _quickSaveMode = QuickSaveMode.favorites;\n  bool _receiveSuccessNotifications = true;\n',
              '  QuickSaveMode _quickSaveMode = QuickSaveMode.favorites;\n  bool _receiveSuccessNotifications = true;\n  AppLanguage _language = AppLanguage.english;\n', 1)
          text = text.replace(
              "      _receiveSuccessNotifications =\n          prefs.getBool('receive_success_notifications') ?? true;\n      notifyListeners();\n",
              "      _receiveSuccessNotifications =\n          prefs.getBool('receive_success_notifications') ?? true;\n      final languageIndex = prefs.getInt('language') ?? AppLanguage.english.index;\n      _language = AppLanguage.values[\n        languageIndex.clamp(0, AppLanguage.values.length - 1)\n      ];\n      notifyListeners();\n", 1)
          helper_anchor = '  Future<void> setQuickSaveMode(QuickSaveMode mode) async {\n'
          helper = '''  void setLanguage(AppLanguage language) {
            _language = language;
          }

            String _localizedTransferError(String? raw, {required bool isSending}) {
              final lower = (raw ?? '').toLowerCase();
              String key;
              if (lower.contains('user interrupt') || lower.contains('cancel')) {
                key = 'remoteCancelled';
              } else if (lower.contains('reject') || lower.contains('declin')) {
                key = 'remoteRejected';
              } else if (lower.contains('timeout') || lower.contains('timed out')) {
                key = 'transferTimedOut';
              } else if (lower.contains('disconnect') ||
                  lower.contains('connection') ||
                  lower.contains('closed') ||
                  lower.contains('websocket')) {
                key = 'connectionLost';
              } else {
                key = isSending ? 'sendFailed' : 'receiveFailed';
              }
              return appText(_language, key);
            }

            Future<void> setQuickSaveMode(QuickSaveMode mode) async {
          '''
          if helper_anchor not in text:
              raise SystemExit('missing BridgeClient helper anchor')
          text = text.replace(helper_anchor, helper, 1)

          old = '''      } else if (type == 'receiveFailed' || type == 'sendFailed') {
            onNotification?.call('OsharePC', 'File transfer failed.');
            final error = data is Map ? data['error']?.toString() : null;
            _transferState = TransferStateModel(
              active: true,
              isSending: type == 'sendFailed' ? true : false,
              targetDevice: _transferState.targetDevice,
              fileName: _transferState.fileName,
              fileCount: _transferState.fileCount,
              sentBytes: _transferState.sentBytes,
              totalBytes: _transferState.totalBytes,
              phase: 'failed',
              statusText: 'Transfer failed',
              errorText: error ?? 'Could not save the received file',
            );
          '''
          new = '''      } else if (type == 'receiveFailed' || type == 'sendFailed') {
            final isSendingFailure = type == 'sendFailed';
            final error = data is Map ? data['error']?.toString() : null;
            final localizedError = _localizedTransferError(
              error,
              isSending: isSendingFailure,
            );
            debugPrint('Backend transfer failure detail: ${error ?? '(none)'}');
            onNotification?.call('OsharePC', appText(_language, 'transferFailed'));
            _transferState = TransferStateModel(
              active: true,
              isSending: isSendingFailure,
              targetDevice: _transferState.targetDevice,
              fileName: _transferState.fileName,
              fileCount: _transferState.fileCount,
              sentBytes: _transferState.sentBytes,
              totalBytes: _transferState.totalBytes,
              phase: 'failed',
              statusText: appText(_language, 'transferFailed'),
              errorText: localizedError,
            );
          '''
          if old not in text:
              raise SystemExit('missing BridgeClient event failure anchor')
          text = text.replace(old, new, 1)

          old = '''      _transferState = TransferStateModel(
            active: true,
            isSending: true,
            targetDevice: device.name,
            phase: 'failed',
            statusText: 'Transfer failed',
            errorText:
                error ?? 'Could not start the transfer (${resp.statusCode}).',
          );
          '''
          new = '''      debugPrint('Backend send failure detail: ${error ?? 'HTTP ${resp.statusCode}'}');
            _transferState = TransferStateModel(
              active: true,
              isSending: true,
              targetDevice: device.name,
              phase: 'failed',
              statusText: appText(_language, 'transferFailed'),
              errorText: _localizedTransferError(error, isSending: true),
            );
          '''
          if old not in text:
              raise SystemExit('missing BridgeClient send response anchor')
          text = text.replace(old, new, 1)

          old = '''      _transferState = TransferStateModel(
            active: true,
            isSending: true,
            targetDevice: device.name,
            phase: 'failed',
            statusText: 'Transfer failed',
            errorText: 'Could not start the transfer: $e',
          );
          '''
          new = '''      _transferState = TransferStateModel(
            active: true,
            isSending: true,
            targetDevice: device.name,
            phase: 'failed',
            statusText: appText(_language, 'transferFailed'),
            errorText: appText(_language, 'sendFailed'),
          );
          '''
          if old not in text:
              raise SystemExit('missing BridgeClient send exception anchor')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('catshare_gui/lib/main.dart')
          text = p.read_text(encoding='utf-8')
          if '  runApp(\n' not in text:
              raise SystemExit('missing main runApp anchor')
          text = text.replace('  runApp(\n', '  bridgeClient.setLanguage(initialLanguage);\n\n  runApp(\n', 1)
          old = '''  Future<void> _onLanguageChanged(AppLanguage language) async {
            setState(() => _language = language);
          '''
          new = '''  Future<void> _onLanguageChanged(AppLanguage language) async {
            setState(() => _language = language);
            widget.bridgeClient.setLanguage(language);
          '''
          if old not in text:
              raise SystemExit('missing main language-change anchor')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 6) Correct stale SSE comment.
          replace_once(
              'CatShareBridgeServer.cs',
              '/// <summary>Localhost control plane for the Flutter shell. Manages SenderEngine lifecycle and provides REST/SSE/event bridge.</summary>',
              '/// <summary>Localhost control plane for the Flutter shell. Manages SenderEngine lifecycle and provides a REST/polling event bridge.</summary>',
              'bridge summary comment')

          print('requested code review fixes applied')
          '@ | Set-Content -LiteralPath review_fixes.py -Encoding UTF8
          python review_fixes.py
          Remove-Item review_fixes.py
      - name: Check diff
        shell: pwsh
        run: git diff --check
      - name: Build backend
        run: dotnet build CatShareSender.csproj -c Release
      - name: Backend selftest
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exited $($p.ExitCode)" }
      - name: Mock phone tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          foreach ($arg in @('--mockphone', '--mockphone-cancel')) {
            $p = Start-Process $exe.FullName -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg exited $($p.ExitCode)" }
          }
      - name: Analyze Flutter
        working-directory: catshare_gui
        run: |
          flutter pub get
          flutter analyze
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WifiJoiner.cs CatShareBridgeServer.cs catshare_gui/lib/pages/settings_tab.dart catshare_gui/lib/config/language.dart catshare_gui/lib/services/bridge_client.dart catshare_gui/lib/main.dart
          git diff --cached --check
          git commit -m 'Fix review findings for cleanup lifecycle and localization'
          git push origin HEAD:main
