name: Normalize requested review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-review-fixes.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
      - name: Normalize touched files
        shell: pwsh
        run: |
          dart format catshare_gui/lib/pages/settings_tab.dart catshare_gui/lib/config/language.dart catshare_gui/lib/services/bridge_client.dart catshare_gui/lib/main.dart
          @'
          from pathlib import Path
          p = Path('WifiJoiner.cs')
          text = p.read_text(encoding='utf-8')
          old = '''        var staleXml = Path.Combine(Path.GetTempPath(), ProfileName + ".xml");
          try
          {
              if (File.Exists(staleXml))
              {
                  File.Delete(staleXml);
                  Log.Info($"RX: removed stale WLAN profile XML '{staleXml}'");
              }
          }
          catch (Exception ex)
          {
              Log.Warn($"RX: stale WLAN profile XML cleanup failed: {ex.Message}");
          }

          try
              {
          '''
          # GitHub rendering may de-indent the inserted block differently, so normalize by
          # replacing the region structurally from staleXml through the second try opener.
          import re
          pattern = re.compile(r'''        var staleXml = Path\.Combine\(Path\.GetTempPath\(\), ProfileName \+ "\\.xml"\);\n\s*try\n\s*\{\n\s*if \(File\.Exists\(staleXml\)\)\n\s*\{\n\s*File\.Delete\(staleXml\);\n\s*Log\.Info\(\$"RX: removed stale WLAN profile XML '\{staleXml\}'"\);\n\s*\}\n\s*\}\n\s*catch \(Exception ex\)\n\s*\{\n\s*Log\.Warn\(\$"RX: stale WLAN profile XML cleanup failed: \{ex\.Message\}"\);\n\s*\}\n\s*try\n\s*\{''')
          replacement = '''        var staleXml = Path.Combine(Path.GetTempPath(), ProfileName + ".xml");
              try
              {
                  if (File.Exists(staleXml))
                  {
                      File.Delete(staleXml);
                      Log.Info($"RX: removed stale WLAN profile XML '{staleXml}'");
                  }
              }
              catch (Exception ex)
              {
                  Log.Warn($"RX: stale WLAN profile XML cleanup failed: {ex.Message}");
              }

              try
              {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'WifiJoiner formatting region matches={count}')
          p.write_text(text, encoding='utf-8')
          '@ | Set-Content normalize.py -Encoding UTF8
          python normalize.py
          Remove-Item normalize.py
          git diff --check
      - name: Verify Flutter
        working-directory: catshare_gui
        run: |
          flutter pub get
          flutter analyze
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WifiJoiner.cs catshare_gui/lib/pages/settings_tab.dart catshare_gui/lib/config/language.dart catshare_gui/lib/services/bridge_client.dart catshare_gui/lib/main.dart
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Normalize review fix formatting'
            git push origin HEAD:main
          }
