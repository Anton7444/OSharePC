name: Apply requested code review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
      - name: Apply fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor: {label} in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) settings_tab.dart: consistent mounted guard after async preference load.
          replace_once(
              'catshare_gui/lib/pages/settings_tab.dart',
              """  Future<void> _loadTrayPrefs() async {
            try {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
          """,
              """  Future<void> _loadTrayPrefs() async {
            try {
              final prefs = await SharedPreferences.getInstance();
              if (!mounted) return;
              setState(() {
          """,
              'tray mounted guard')

          # 2) WifiJoiner.cs: remove plaintext WLAN profile XML left by hard-killed runs.
          replace_once(
              'WifiJoiner.cs',
              """    public static async Task CleanupStaleProfiles()
              {
                  try
                  {
                      var shown = await Netsh(\"wlan show profiles\");
          """,
              """    public static async Task CleanupStaleProfiles()
              {
                  var staleXml = Path.Combine(Path.GetTempPath(), ProfileName + \".xml\");
                  try
                  {
                      if (File.Exists(staleXml))
                      {
                          File.Delete(staleXml);
                          Log.Info($\"RX: removed stale WLAN profile XML '{staleXml}'\");
                      }
                  }
                  catch (Exception ex)
                  {
                      Log.Warn($\"RX: stale WLAN profile XML cleanup failed: {ex.Message}\");
                  }

                  try
                  {
                      var shown = await Netsh(\"wlan show profiles\");
          """,
              'stale wifi xml cleanup')

          # 3) Localization: add transfer-failure strings in all supported languages.
          p = Path('catshare_gui/lib/config/language.dart')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "      'stagingFailed': 'Could not stage the selected files.',\n": """      'stagingFailed': 'Could not stage the selected files.',
              'transferFailed': 'Transfer failed',
              'sendFailed': 'Could not send the file.',
              'receiveFailed': 'Could not receive the file.',
              'remoteCancelled': 'The phone cancelled the transfer.',
              'remoteRejected': 'The phone rejected the transfer.',
              'connectionLost': 'The connection to the phone was lost.',
              'transferTimedOut': 'The transfer timed out.',
          """,
              "      'stagingFailed': '无法暂存所选文件。',\n": """      'stagingFailed': '无法暂存所选文件。',
              'transferFailed': '传输失败',
              'sendFailed': '无法发送文件。',
              'receiveFailed': '无法接收文件。',
              'remoteCancelled': '手机已取消传输。',
              'remoteRejected': '手机已拒绝传输。',
              'connectionLost': '与手机的连接已断开。',
              'transferTimedOut': '传输超时。',
          """,
              "      'stagingFailed': '無法暫存選取的檔案。',\n": """      'stagingFailed': '無法暫存選取的檔案。',
              'transferFailed': '傳送失敗',
              'sendFailed': '無法傳送檔案。',
              'receiveFailed': '無法接收檔案。',
              'remoteCancelled': '手機已取消傳送。',
              'remoteRejected': '手機已拒絕傳送。',
              'connectionLost': '與手機的連線已中斷。',
              'transferTimedOut': '傳送逾時。',
          """,
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing language anchor: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # BridgeClient tracks current app language and converts backend details to stable localized UI text.
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              "import '../models/models.dart';\n",
              "import '../config/language.dart';\nimport '../models/models.dart';\n",
              'bridge language import')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """  QuickSaveMode _quickSaveMode = QuickSaveMode.favorites;
            bool _receiveSuccessNotifications = true;
          """,
              """  QuickSaveMode _quickSaveMode = QuickSaveMode.favorites;
            bool _receiveSuccessNotifications = true;
            AppLanguage _language = AppLanguage.english;
          """,
              'bridge language field')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """      _receiveSuccessNotifications =
                  prefs.getBool('receive_success_notifications') ?? true;
              notifyListeners();
          """,
              """      _receiveSuccessNotifications =
                  prefs.getBool('receive_success_notifications') ?? true;
              final languageIndex = prefs.getInt('language') ?? AppLanguage.english.index;
              _language = AppLanguage.values[
                languageIndex.clamp(0, AppLanguage.values.length - 1)
              ];
              notifyListeners();
          """,
              'bridge preference language')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """  Future<void> setQuickSaveMode(QuickSaveMode mode) async {
          """,
              """  void setLanguage(AppLanguage language) {
            _language = language;
          }

            String _localizedTransferError(String? raw, {required bool isSending}) {
              final lower = (raw ?? '').toLowerCase();
              String key;
              if (lower.contains('user interrupt') || lower.contains('cancel')) {
                key = 'remoteCancelled';
              } else if (lower.contains('reject') || lower.contains('declin')) {
                key = 'remoteRejected';
              } else if (lower.contains('timeout') || lower.contains('timed out')) {
                key = 'transferTimedOut';
              } else if (lower.contains('disconnect') ||
                  lower.contains('connection') ||
                  lower.contains('closed') ||
                  lower.contains('websocket')) {
                key = 'connectionLost';
              } else {
                key = isSending ? 'sendFailed' : 'receiveFailed';
              }
              return appText(_language, key);
            }

            Future<void> setQuickSaveMode(QuickSaveMode mode) async {
          """,
              'bridge localized error helper')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """      } else if (type == 'receiveFailed' || type == 'sendFailed') {
                onNotification?.call('OsharePC', 'File transfer failed.');
                final error = data is Map ? data['error']?.toString() : null;
                _transferState = TransferStateModel(
                  active: true,
                  isSending: type == 'sendFailed' ? true : false,
                  targetDevice: _transferState.targetDevice,
                  fileName: _transferState.fileName,
                  fileCount: _transferState.fileCount,
                  sentBytes: _transferState.sentBytes,
                  totalBytes: _transferState.totalBytes,
                  phase: 'failed',
                  statusText: 'Transfer failed',
                  errorText: error ?? 'Could not save the received file',
                );
          """,
              """      } else if (type == 'receiveFailed' || type == 'sendFailed') {
                final isSendingFailure = type == 'sendFailed';
                final error = data is Map ? data['error']?.toString() : null;
                final localizedError = _localizedTransferError(
                  error,
                  isSending: isSendingFailure,
                );
                debugPrint('Backend transfer failure detail: ${error ?? '(none)'}');
                onNotification?.call('OsharePC', appText(_language, 'transferFailed'));
                _transferState = TransferStateModel(
                  active: true,
                  isSending: isSendingFailure,
                  targetDevice: _transferState.targetDevice,
                  fileName: _transferState.fileName,
                  fileCount: _transferState.fileCount,
                  sentBytes: _transferState.sentBytes,
                  totalBytes: _transferState.totalBytes,
                  phase: 'failed',
                  statusText: appText(_language, 'transferFailed'),
                  errorText: localizedError,
                );
          """,
              'event failure localization')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """      _transferState = TransferStateModel(
                active: true,
                isSending: true,
                targetDevice: device.name,
                phase: 'failed',
                statusText: 'Transfer failed',
                errorText:
                    error ?? 'Could not start the transfer (${resp.statusCode}).',
              );
          """,
              """      debugPrint('Backend send failure detail: ${error ?? 'HTTP ${resp.statusCode}'}');
              _transferState = TransferStateModel(
                active: true,
                isSending: true,
                targetDevice: device.name,
                phase: 'failed',
                statusText: appText(_language, 'transferFailed'),
                errorText: _localizedTransferError(error, isSending: true),
              );
          """,
              'send response failure localization')
          replace_once(
              'catshare_gui/lib/services/bridge_client.dart',
              """      _transferState = TransferStateModel(
                active: true,
                isSending: true,
                targetDevice: device.name,
                phase: 'failed',
                statusText: 'Transfer failed',
                errorText: 'Could not start the transfer: $e',
              );
          """,
              """      _transferState = TransferStateModel(
                active: true,
                isSending: true,
                targetDevice: device.name,
                phase: 'failed',
                statusText: appText(_language, 'transferFailed'),
                errorText: appText(_language, 'sendFailed'),
              );
          """,
              'send exception localization')

          # Keep BridgeClient synchronized when the user changes UI language.
          replace_once(
              'catshare_gui/lib/main.dart',
              """  runApp(
          """,
              """  bridgeClient.setLanguage(initialLanguage);

            runApp(
          """,
              'initial bridge language')
          replace_once(
              'catshare_gui/lib/main.dart',
              """  Future<void> _onLanguageChanged(AppLanguage language) async {
            setState(() => _language = language);
          """,
              """  Future<void> _onLanguageChanged(AppLanguage language) async {
            setState(() => _language = language);
            widget.bridgeClient.setLanguage(language);
          """,
              'language change sync')

          # 6) stale SSE wording: bridge is polling/event queue based.
          replace_once(
              'CatShareBridgeServer.cs',
              '/// <summary>Localhost control plane for the Flutter shell. Manages SenderEngine lifecycle and provides REST/SSE/event bridge.</summary>',
              '/// <summary>Localhost control plane for the Flutter shell. Manages SenderEngine lifecycle and provides a REST/polling event bridge.</summary>',
              'bridge summary comment')

          print('requested code review fixes applied')
          '@ | Set-Content -LiteralPath review_fixes.py -Encoding UTF8
          python review_fixes.py
          Remove-Item review_fixes.py
      - name: Check diff
        shell: pwsh
        run: git diff --check
      - name: Build backend
        run: dotnet build CatShareSender.csproj -c Release
      - name: Backend selftest
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exited $($p.ExitCode)" }
      - name: Mock phone tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          foreach ($arg in @('--mockphone', '--mockphone-cancel')) {
            $p = Start-Process $exe.FullName -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg exited $($p.ExitCode)" }
          }
      - name: Analyze Flutter
        working-directory: catshare_gui
        run: |
          flutter pub get
          flutter analyze
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WifiJoiner.cs CatShareBridgeServer.cs catshare_gui/lib/pages/settings_tab.dart catshare_gui/lib/config/language.dart catshare_gui/lib/services/bridge_client.dart catshare_gui/lib/main.dart
          git diff --cached --check
          git commit -m 'Fix review findings for cleanup lifecycle and localization'
          git push origin HEAD:main
