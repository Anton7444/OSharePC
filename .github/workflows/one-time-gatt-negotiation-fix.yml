name: Apply GATT negotiation compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-gatt-negotiation-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Apply GATT fix
        run: python scripts/one_time_gatt_negotiation_fix.py
      - name: Check diff
        shell: pwsh
        run: git diff --check
      - name: Build backend
        run: dotnet build CatShareSender.csproj -c Release
      - name: Backend selftest
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exited $($p.ExitCode)" }
      - name: Mock phone regressions
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin/Release -Filter CatShareSender.exe -Recurse | Select-Object -First 1
          foreach ($arg in @('--mockphone', '--mockphone-cancel')) {
            $p = Start-Process $exe.FullName -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg exited $($p.ExitCode)" }
          }
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GattLink.cs ReceiveGattServer.cs
          git diff --cached --check
          git commit -m 'Stabilize pairless GATT negotiation on tablets'
          git push origin HEAD:main
